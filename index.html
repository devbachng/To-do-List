<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban To-Do List</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style></style>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="text-center mb-4">📋 My To-Do List</h2>

      <!-- Tìm kiếm -->
      <div class="row">
        <div class="col-md-8">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="🔍 Tìm kiếm nhiệm vụ..."
          />
        </div>
        <div class="col-md-4">
          <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
              <select id="priorityFilter" class="form-select">
                <option value="all">📌 Lọc theo ưu tiên</option>
                <option value="Cao">Cao</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Thấp">Thấp</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="row" id="board">
        <!-- Cột Todo -->
        <div class="col-md-4 mb-3">
          <div
            class="kanban-board bg-white p-3 rounded shadow-sm"
            data-column="todo"
          >
            <h5 class="board-title">📝 Cần làm</h5>
            <div class="mb-2">
              <div class="row">
                <div class="col-md-8">
                  <input
                    type="text"
                    class="form-control task-input mb-2"
                    placeholder="Tên nhiệm vụ"
                  />
                </div>

                <div class="col-md-4">
                  <button class="btn btn-sm btn-outline-primary w-100 add-task-btn">
                    Thêm
                  </button>
                </div>
              </div>
            </div>
            <div class="task-container"></div>
          </div>
        </div>

        <!-- Cột In Progress -->
        <div class="col-md-4 mb-3">
          <div
            class="kanban-board bg-white p-3 rounded shadow-sm"
            data-column="inprogress"
          >
            <h5 class="board-title">🚧 Đang làm</h5>
            <div class="task-container">
            </div>
          </div>
        </div>

        <!-- Cột Done -->
        <div class="col-md-4 mb-3">
          <div
            class="kanban-board bg-white p-3 rounded shadow-sm"
            data-column="done"
          >
            <h5 class="board-title">✅ Đã xong</h5>
            <div class="task-container"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="saveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto">Thông báo</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
          Đã lưu thay đổi thành công!
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
